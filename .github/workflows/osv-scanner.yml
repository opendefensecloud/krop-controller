name: OSV-Scanner

on:
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "44 4 * * *"
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  scan-scheduled:
    permissions:
      contents: read
      actions: read
      security-events: write
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      # Example of specifying custom arguments
      scan-args: |-
        --include-git-root
        --config ./.osv-scanner.toml
        -r
        ./
  scan-pr:
    permissions:
      contents: read
      actions: read
      security-events: write
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      # Example of specifying custom arguments
      scan-args: |-
        --include-git-root
        --config ./.osv-scanner.toml
        -r
        ./
