name: Build/Publish Docker Image

permissions:
  contents: read

env:
  PLATFORMS: linux/amd64,linux/arm64

on:
  # Tag builds come in through release.yaml, which needs this run's SBOMs
  # before it can create the draft release.
  workflow_call:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
    types: [labeled, unlabeled, opened, synchronize, reopened]

jobs:
  buildAndPush:
    permissions:
      contents: read
      packages: write
      id-token: write # for keyless signing
      attestations: write
    name: Build and Publish Docker Image
    # Condition: Run on push to main, a tag build called from release.yaml, or PR with 'ok-to-image' label
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && (
        contains(toJSON(github.event.pull_request.labels), '"ok-to-image"') ||
        contains(toJSON(github.event.pull_request.labels), '"ok-to-e2e"')
      ))
    runs-on: ubuntu-26.04
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: |
            ghcr.io/opendefensecloud/krop-controller
          tags: |
            type=semver,pattern={{version}}
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: image
        timeout-minutes: 20
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          # BuildKit attaches one SBOM attestation per platform, which is what
          # a multi-arch image needs. actions/attest can only ever name a
          # single subject-digest, so it would have to pair one architecture's
          # SBOM with the shared index digest.
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image with cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
          TAGS: ${{ steps.meta.outputs.tags }}
          GH_REPO: ${{ github.repository }}
          GH_WORKFLOW: ${{ github.workflow }}
          GH_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mapfile -t TAG_LIST <<< "$TAGS"
          for tag in "${TAG_LIST[@]}"; do
            cosign sign \
              -a "repo=${GH_REPO}" \
              -a "workflow=${GH_WORKFLOW}" \
              -a "sha=${GH_SHA}" \
              --yes \
              "${tag}@${IMAGE_DIGEST}"
          done
      - name: Install syft
        id: syft
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # Release assets, not attestations: the registry gets BuildKit's SPDX
      # attestation per platform, the release gets CycloneDX files that the
      # OCM pipeline can embed. syft resolves the index to the runner's own
      # platform unless told otherwise, so ask for each one explicitly.
      - name: Generate per-architecture SBOMs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE: ghcr.io/opendefensecloud/krop-controller
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p sboms
          for p in ${PLATFORMS//,/ }; do
            "$SYFT" scan --platform "$p" "${IMAGE}@${DIGEST}" \
              -o "cyclonedx-json=sboms/krop-controller-${p//\//-}.cyclonedx.json"
          done
      - name: Upload SBOMs for the release job
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sboms/
          retention-days: 1
      # create-storage-record only feeds the org Linked Artifacts page, which
      # we dont use. It defaults to true whenever push-to-registry is set and
      # has only ever failed here with "no artifacts found", so turn it off
      # rather than keep a bogus warning per build.
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/opendefensecloud/krop-controller
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
