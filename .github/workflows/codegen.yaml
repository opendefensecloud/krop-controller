name: Codegen Check
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go-version
        uses: opendefensecloud/dev-kit/.github/actions/get-go-version@983ddfc02224cbb84e8fdf875683525881b96a72 # v4.0.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}
      - name: Run codegen
        run: |
          make generate manifests
      - name: Check for changes
        uses: opendefensecloud/dev-kit/.github/actions/diff-check@983ddfc02224cbb84e8fdf875683525881b96a72 # v4.0.0
